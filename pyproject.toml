[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsxops"
version = "0.1.0"
description = "Reliable Excel (.xlsx) operations for LLM tool layers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1.2", "jsonschema>=4.18"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["xlsxops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
